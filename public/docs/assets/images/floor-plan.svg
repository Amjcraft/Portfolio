<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="660" fill="#fbf7f0"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#5e3d1c">Floor Plan — Outdoor Sauna (~9.5′ × 8′)</text>
  <text x="380" y="58" text-anchor="middle" font-size="12" fill="#4c463f">2×6 walls · interior ~8.2′ × 6.7′ · L-benches to back wall · door beside heater · scale ≈ 1″ : 5px</text>

  <!-- exterior + interior walls (front/back = 9', sides = 8') -->
  <rect x="110" y="120" width="540" height="480" fill="#e7d7bf" stroke="#5e3d1c" stroke-width="2"/>
  <rect x="140" y="150" width="480" height="420" fill="#fdfbf7" stroke="#5e3d1c" stroke-width="1.5"/>

  <!-- upper bench L (hug back + left walls, 24" deep; back leg stretched to right wall) -->
  <g>
    <rect x="140" y="150" width="120" height="420" fill="#c89b6a" stroke="#8a5a2b"/>
    <rect x="260" y="150" width="360" height="120" fill="#c89b6a" stroke="#8a5a2b"/>
    <text x="200" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#5e3d1c" transform="rotate(-90 200 360)">UPPER BENCH · 24″ D · ~40″ H</text>
    <text x="440" y="215" text-anchor="middle" font-size="11" font-weight="600" fill="#5e3d1c">upper back leg (72″)</text>
  </g>
  <!-- lower bench L (in front, 18" deep; also stretched) -->
  <g>
    <rect x="260" y="270" width="90" height="300" fill="#b5824f" stroke="#7a4e22"/>
    <rect x="350" y="270" width="270" height="90" fill="#b5824f" stroke="#7a4e22"/>
    <text x="305" y="470" text-anchor="middle" font-size="11" font-weight="600" fill="#fff" transform="rotate(-90 305 470)">LOWER · 18″ D</text>
    <text x="485" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">lower step (stretched)</text>
  </g>

  <!-- heater (front-right corner, oriented 20" along front wall x 24" deep) -->
  <rect x="520" y="450" width="100" height="120" fill="#c1440e" stroke="#7a2607"/>
  <text x="570" y="506" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">HEATER</text>
  <text x="570" y="523" text-anchor="middle" font-size="9" fill="#fff">9.5kW · 20 front</text>
  <!-- guard rail HUGGING heater (~4" off the two exposed faces) -->
  <polyline points="500,570 500,430 620,430" fill="none" stroke="#7a2607" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="494" y="426" text-anchor="end" font-size="10" fill="#7a2607">guard rail (hugs heater)</text>

  <!-- door on front wall: 3" frame + 22" leaf + 3" frame; bench edge = frame edge at x350 -->
  <rect x="350" y="566" width="15" height="8" fill="#8a5a2b"/>
  <rect x="475" y="566" width="15" height="8" fill="#8a5a2b"/>
  <rect x="365" y="566" width="110" height="8" fill="#fbf7f0"/>
  <line x1="365" y1="570" x2="365" y2="610" stroke="#8a5a2b" stroke-width="3"/>
  <path d="M365 610 A45 45 0 0 0 410 570" fill="none" stroke="#8a5a2b" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="350" y1="150" x2="350" y2="566" stroke="#7a4e22" stroke-width="0.7" stroke-dasharray="3 3"/>
  <text x="420" y="628" text-anchor="middle" font-size="10" fill="#5e3d1c">22″ leaf + 3″ frame each side (28″ RO) — outswing</text>
  <text x="352" y="592" font-size="9" fill="#7a4e22">bench edge = frame edge</text>

  <!-- ~6" clearance callout heater<->door frame -->
  <line x1="490" y1="556" x2="520" y2="556" stroke="#7a2607" stroke-width="1"/>
  <text x="505" y="550" text-anchor="middle" font-size="8" fill="#7a2607">~6″</text>

  <!-- floor drain + run to French drain -->
  <circle cx="440" cy="430" r="9" fill="none" stroke="#3a6ea5" stroke-width="2"/>
  <text x="440" y="415" text-anchor="middle" font-size="10" fill="#3a6ea5">floor drain</text>
  <path d="M440 439 L440 470 L300 470" fill="none" stroke="#3a6ea5" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="298" y="486" text-anchor="end" font-size="10" fill="#3a6ea5">2″ PVC in floor cavity → French drain</text>

  <!-- rear window removed per owner; back wall solid -->

  <!-- dimensions: top ~9'-0" -->
  <line x1="110" y1="88" x2="650" y2="88" stroke="#4c463f" stroke-width="1"/>
  <line x1="110" y1="82" x2="110" y2="94" stroke="#4c463f"/>
  <line x1="650" y1="82" x2="650" y2="94" stroke="#4c463f"/>
  <rect x="348" y="78" width="64" height="18" fill="#fbf7f0"/>
  <text x="380" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#22201d">~9′-6″</text>
  <!-- left 8'-0" -->
  <line x1="88" y1="120" x2="88" y2="600" stroke="#4c463f" stroke-width="1"/>
  <line x1="82" y1="120" x2="94" y2="120" stroke="#4c463f"/>
  <line x1="82" y1="600" x2="94" y2="600" stroke="#4c463f"/>
  <text x="88" y="365" text-anchor="middle" font-size="12" font-weight="600" fill="#22201d" transform="rotate(-90 88 365)">8′-0″</text>

  <text x="678" y="140" font-size="11" fill="#8a8378">N</text>
  <path d="M672 165 L672 145 M667 150 L672 143 L677 150" stroke="#8a8378" fill="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 600" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="740" height="600" fill="#fbf7f0"/>
  <text x="370" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#5e3d1c">Construction Sequence — Build Storyboard</text>
  <text x="370" y="54" text-anchor="middle" font-size="12" fill="#4c463f">Side elevation · shed profile (low wall left → high wall right) · cumulative stages</text>

  <!-- ================= PANEL 1: existing slab ================= -->
  <g>
    <rect x="30" y="80" width="210" height="215" fill="#fff" stroke="#e0d4c1"/>
    <text x="46" y="102" font-size="13" font-weight="700" fill="#c1440e">1 · Existing slab</text>
    <rect x="70" y="250" width="130" height="16" fill="#b9b9b9" stroke="#7d7d7d"/>
    <text x="135" y="284" text-anchor="middle" font-size="10" fill="#4c463f">Slab already poured — no concrete work</text>
  </g>

  <!-- ================= PANEL 2: raised floor + drain ================= -->
  <g>
    <rect x="265" y="80" width="210" height="215" fill="#fff" stroke="#e0d4c1"/>
    <text x="281" y="102" font-size="13" font-weight="700" fill="#c1440e">2 · Raised 2×6 floor + drain</text>
    <rect x="305" y="250" width="130" height="16" fill="#b9b9b9" stroke="#7d7d7d"/>
    <rect x="308" y="232" width="124" height="18" fill="#d9b98a" stroke="#8a5a2b"/>
    <g stroke="#8a5a2b"><line x1="330" y1="232" x2="330" y2="250"/><line x1="355" y1="232" x2="355" y2="250"/><line x1="380" y1="232" x2="380" y2="250"/><line x1="405" y1="232" x2="405" y2="250"/></g>
    <line x1="360" y1="241" x2="446" y2="245" stroke="#3a6ea5" stroke-width="3"/>
    <text x="370" y="284" text-anchor="middle" font-size="10" fill="#4c463f">PT joists on slab · drain in cavity → out</text>
  </g>

  <!-- ================= PANEL 3: wall framing ================= -->
  <g>
    <rect x="500" y="80" width="210" height="215" fill="#fff" stroke="#e0d4c1"/>
    <text x="516" y="102" font-size="13" font-weight="700" fill="#c1440e">3 · Wall framing</text>
    <rect x="540" y="250" width="130" height="16" fill="#b9b9b9" stroke="#7d7d7d"/>
    <rect x="543" y="232" width="124" height="18" fill="#d9b98a" stroke="#8a5a2b"/>
    <!-- shed studs: left short (top y150), right tall (top y120) -->
    <g stroke="#8a5a2b" stroke-width="2">
      <line x1="548" y1="150" x2="548" y2="232"/>
      <line x1="578" y1="143" x2="578" y2="232"/>
      <line x1="608" y1="136" x2="608" y2="232"/>
      <line x1="638" y1="129" x2="638" y2="232"/>
      <line x1="662" y1="123" x2="662" y2="232"/>
      <line x1="548" y1="150" x2="662" y2="123"/>
      <line x1="548" y1="232" x2="662" y2="232"/>
    </g>
    <rect x="588" y="196" width="18" height="36" fill="#fff" stroke="#8a5a2b"/>
    <text x="605" y="284" text-anchor="middle" font-size="10" fill="#4c463f">Studs @16″ · shed top plate · door RO</text>
  </g>

  <!-- ================= PANEL 4: roof framing + sheathing ================= -->
  <g>
    <rect x="30" y="330" width="210" height="230" fill="#fff" stroke="#e0d4c1"/>
    <text x="46" y="352" font-size="13" font-weight="700" fill="#c1440e">4 · Roof + sheathing</text>
    <rect x="70" y="510" width="130" height="16" fill="#b9b9b9" stroke="#7d7d7d"/>
    <rect x="73" y="492" width="124" height="18" fill="#d9b98a" stroke="#8a5a2b"/>
    <!-- solid walls (sheathed) -->
    <polygon points="78,410 192,383 192,492 78,492" fill="#e7d7bf" stroke="#5e3d1c"/>
    <!-- roof deck -->
    <polygon points="68,414 198,387 198,401 68,428" fill="#a9793f" stroke="#5e3d1c"/>
    <text x="135" y="544" text-anchor="middle" font-size="10" fill="#4c463f">Shed rafters + roof/wall OSB sheathing</text>
  </g>

  <!-- ================= PANEL 5: insulation + foil + wrap ================= -->
  <g>
    <rect x="265" y="330" width="210" height="230" fill="#fff" stroke="#e0d4c1"/>
    <text x="281" y="352" font-size="13" font-weight="700" fill="#c1440e">5 · Insulation · foil · wrap</text>
    <rect x="305" y="510" width="130" height="16" fill="#b9b9b9" stroke="#7d7d7d"/>
    <rect x="308" y="492" width="124" height="18" fill="#d9b98a" stroke="#8a5a2b"/>
    <polygon points="313,410 427,383 427,492 313,492" fill="#f2cccc" stroke="#5e3d1c"/>
    <polygon points="313,410 427,383 427,392 313,419" fill="#a9793f" stroke="#5e3d1c"/>
    <!-- foil line inside -->
    <polyline points="319,414 319,490 421,490 421,388" fill="none" stroke="#c1440e" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="370" y="544" text-anchor="middle" font-size="10" fill="#4c463f">Mineral wool · foil barrier · house wrap</text>
  </g>

  <!-- ================= PANEL 6: finished (cedar) ================= -->
  <g>
    <rect x="500" y="330" width="210" height="230" fill="#fff" stroke="#e0d4c1"/>
    <text x="516" y="352" font-size="13" font-weight="700" fill="#2e7d32">6 · Finished — clad</text>
    <rect x="540" y="510" width="130" height="16" fill="#b9b9b9" stroke="#7d7d7d"/>
    <rect x="543" y="492" width="124" height="18" fill="#8a5a2b" stroke="#5e3d1c"/>
    <polygon points="548,410 662,383 662,492 548,492" fill="#c89b6a" stroke="#5e3d1c"/>
    <polygon points="538,414 672,387 672,401 538,428" fill="#8a5a2b" stroke="#5e3d1c"/>
    <!-- cedar siding lines -->
    <g stroke="#a06a34" stroke-width="0.8">
      <line x1="548" y1="430" x2="662" y2="405"/><line x1="548" y1="450" x2="662" y2="425"/><line x1="548" y1="470" x2="662" y2="445"/>
    </g>
    <!-- glazed door with large lite (no rear window) -->
    <rect x="588" y="452" width="20" height="40" fill="#5e3d1c" stroke="#3a2712"/>
    <rect x="591" y="456" width="14" height="30" fill="#9ec6e0"/>
    <text x="605" y="544" text-anchor="middle" font-size="10" fill="#4c463f">cheap siding · hemlock interior · glazed door</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#c89b6a" stroke-width="3" fill="none">
    <path d="M243 188 L262 188" marker-end="url(#a)"/>
    <path d="M478 188 L497 188" marker-end="url(#a)"/>
    <path d="M243 445 L262 445" marker-end="url(#a)"/>
    <path d="M478 445 L497 445" marker-end="url(#a)"/>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#c89b6a"/></marker></defs>
</svg>

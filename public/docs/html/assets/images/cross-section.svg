<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="660" fill="#fbf7f0"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#5e3d1c">Cross-Section — Shed Roof, Wall Assembly & Raised Floor</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#4c463f">Looking through the sauna · low wall 8′ (left) → high wall 9.5′ (right) · scale ≈ 1′ : 42px</text>

  <!-- ground -->
  <rect x="120" y="586" width="470" height="24" fill="#cbb79a"/>
  <line x1="120" y1="586" x2="590" y2="586" stroke="#8a7a5c"/>
  <!-- existing slab -->
  <rect x="150" y="560" width="410" height="26" fill="#b9b9b9" stroke="#7d7d7d"/>
  <text x="355" y="578" text-anchor="middle" font-size="10" fill="#3a3a3a">EXISTING CONCRETE SLAB (no work)</text>

  <!-- raised 2x6 floor platform + drain cavity -->
  <rect x="156" y="538" width="398" height="22" fill="#d9b98a" stroke="#8a5a2b"/>
  <g stroke="#8a5a2b" stroke-width="1">
    <line x1="200" y1="538" x2="200" y2="560"/><line x1="260" y1="538" x2="260" y2="560"/>
    <line x1="320" y1="538" x2="320" y2="560"/><line x1="380" y1="538" x2="380" y2="560"/>
    <line x1="440" y1="538" x2="440" y2="560"/><line x1="500" y1="538" x2="500" y2="560"/>
  </g>
  <!-- drain pipe in cavity -->
  <line x1="330" y1="546" x2="556" y2="556" stroke="#3a6ea5" stroke-width="4"/>
  <text x="230" y="553" font-size="9" fill="#5e3d1c">2×6 joists (~5.5″ cavity)</text>
  <text x="470" y="574" font-size="9" fill="#3a6ea5">2″ PVC → French drain</text>
  <!-- finished floor line -->
  <rect x="156" y="530" width="398" height="8" fill="#c89b6a" stroke="#8a5a2b"/>
  <text x="150" y="524" font-size="9" fill="#5e3d1c">waterproof floor + cedar duckboard</text>

  <!-- walls -->
  <rect x="156" y="184" width="24" height="346" fill="#e7d7bf" stroke="#5e3d1c"/>
  <rect x="530" y="121" width="24" height="409" fill="#e7d7bf" stroke="#5e3d1c"/>

  <!-- shed roof -->
  <polygon points="140,190 566,127 566,143 140,206" fill="#8a5a2b" stroke="#5e3d1c"/>
  <line x1="180" y1="196" x2="530" y2="143" stroke="#5e3d1c" stroke-dasharray="4 3"/>
  <text x="360" y="180" text-anchor="middle" font-size="10" fill="#5e3d1c" transform="rotate(-8.6 360 180)">shed roof · +1.5′ rise (~2.25:12)</text>
  <!-- ceiling insulation hatch -->
  <text x="355" y="228" text-anchor="middle" font-size="9" fill="#4c463f">ceiling: mineral wool + foil (insulate heaviest up top)</text>

  <!-- benches (left) -->
  <rect x="180" y="380" width="120" height="10" fill="#c89b6a" stroke="#8a5a2b"/>
  <rect x="290" y="382" width="8" height="148" fill="#b5824f"/>
  <rect x="184" y="382" width="8" height="148" fill="#b5824f"/>
  <text x="240" y="374" text-anchor="middle" font-size="10" fill="#5e3d1c">upper bench (~40″ H · 24″ D)</text>
  <rect x="180" y="457" width="150" height="9" fill="#b5824f" stroke="#7a4e22"/>
  <text x="255" y="452" text-anchor="middle" font-size="10" fill="#5e3d1c">lower bench (~18″ H · 18″ D)</text>

  <!-- heater (right) -->
  <rect x="470" y="410" width="60" height="120" fill="#c1440e" stroke="#7a2607"/>
  <text x="500" y="466" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">HEATER</text>
  <text x="500" y="480" text-anchor="middle" font-size="9" fill="#fff">9.5kW</text>
  <line x1="452" y1="405" x2="452" y2="530" stroke="#7a2607" stroke-dasharray="5 3"/>
  <text x="446" y="400" text-anchor="end" font-size="9" fill="#7a2607">guard rail</text>

  <!-- height dims -->
  <line x1="120" y1="184" x2="120" y2="530" stroke="#4c463f"/>
  <line x1="114" y1="184" x2="126" y2="184" stroke="#4c463f"/>
  <line x1="114" y1="530" x2="126" y2="530" stroke="#4c463f"/>
  <rect x="100" y="348" width="40" height="18" fill="#fbf7f0"/>
  <text x="120" y="362" text-anchor="middle" font-size="11" font-weight="600" fill="#22201d">8′-0″</text>
  <line x1="588" y1="121" x2="588" y2="530" stroke="#4c463f"/>
  <line x1="582" y1="121" x2="594" y2="121" stroke="#4c463f"/>
  <line x1="582" y1="530" x2="594" y2="530" stroke="#4c463f"/>
  <rect x="568" y="316" width="40" height="18" fill="#fbf7f0"/>
  <text x="588" y="330" text-anchor="middle" font-size="11" font-weight="600" fill="#22201d">9′-6″</text>

  <!-- wall assembly legend (inside -> outside) -->
  <text x="60" y="614" font-size="12" font-weight="700" fill="#5e3d1c">Wall assembly (interior → exterior):</text>
  <g font-size="9" fill="#22201d" text-anchor="middle">
    <rect x="60" y="622" width="108" height="26" fill="#c89b6a" stroke="#5e3d1c"/><text x="114" y="638">1 Hemlock T&amp;G</text>
    <rect x="168" y="622" width="108" height="26" fill="#efe6d6" stroke="#5e3d1c"/><text x="222" y="638">2 Air gap / batten</text>
    <rect x="276" y="622" width="108" height="26" fill="#d6cdbd" stroke="#5e3d1c"/><text x="330" y="638">3 Foil vapor barrier</text>
    <rect x="384" y="622" width="118" height="26" fill="#f2cccc" stroke="#5e3d1c"/><text x="443" y="638">4 Mineral wool / 2×6</text>
    <rect x="502" y="622" width="118" height="26" fill="#e7d7bf" stroke="#5e3d1c"/><text x="561" y="638">5 OSB + house wrap</text>
    <rect x="620" y="622" width="80" height="26" fill="#8a5a2b" stroke="#5e3d1c"/><text x="660" y="638" fill="#fff">6 Siding (non-cedar)</text>
  </g>
</svg>

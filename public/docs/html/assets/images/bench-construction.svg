<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="800" height="800" fill="#fbf7f0"/>
  <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#5e3d1c">Bench Construction — Two-Tier L</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#4c463f">Hidden 2×4 under-frame · clear VG Western Red Cedar slats on seat tops + front aprons · scale (section) ≈ 1″ : 6px</text>

  <!-- =================== SECTION (side view) =================== -->
  <text x="90" y="86" font-size="14" font-weight="700" fill="#c1440e">SECTION (through one bench run)</text>

  <!-- wall + floor -->
  <rect x="78" y="150" width="14" height="300" fill="#e7d7bf" stroke="#5e3d1c"/>
  <text x="70" y="300" font-size="10" fill="#8a8378" transform="rotate(-90 70 300)">WALL</text>
  <line x1="92" y1="450" x2="470" y2="450" stroke="#5e3d1c" stroke-width="2"/>
  <text x="380" y="466" font-size="10" fill="#8a8378">finished floor (over duckboard)</text>

  <!-- hidden 2x4 frame (dashed) -->
  <g stroke="#8a8378" stroke-width="1.2" stroke-dasharray="5 3" fill="none">
    <rect x="92" y="199" width="18" height="18"/>           <!-- upper ledger -->
    <rect x="92" y="199" width="152" height="18"/>          <!-- upper cross-joist -->
    <rect x="226" y="199" width="18" height="251"/>         <!-- upper front leg -->
    <rect x="244" y="325" width="108" height="18"/>         <!-- lower cross-joist -->
    <rect x="334" y="325" width="18" height="125"/>         <!-- lower front leg -->
  </g>
  <text x="150" y="212" font-size="8" fill="#8a8378">2×4 cross-joist @ ~16–24″ OC</text>

  <!-- UPPER seat slats (cedar) : row across 24" depth -->
  <g fill="#c89b6a" stroke="#8a5a2b">
    <rect x="100" y="188" width="21" height="10"/><rect x="124" y="188" width="21" height="10"/>
    <rect x="148" y="188" width="21" height="10"/><rect x="172" y="188" width="21" height="10"/>
    <rect x="196" y="188" width="21" height="10"/><rect x="220" y="188" width="21" height="10"/>
  </g>
  <!-- LOWER seat slats (cedar) : row across 18" depth -->
  <g fill="#c89b6a" stroke="#8a5a2b">
    <rect x="244" y="314" width="21" height="10"/><rect x="268" y="314" width="21" height="10"/>
    <rect x="292" y="314" width="21" height="10"/><rect x="316" y="314" width="21" height="10"/>
  </g>

  <!-- UPPER front apron (cedar slats, vertical face at x=244, riser 22") -->
  <g fill="#b5824f" stroke="#7a4e22">
    <rect x="244" y="198" width="9" height="21"/><rect x="244" y="222" width="9" height="21"/>
    <rect x="244" y="246" width="9" height="21"/><rect x="244" y="270" width="9" height="21"/>
    <rect x="244" y="294" width="9" height="21"/>
  </g>
  <!-- LOWER front: apron slats omitted per owner (frame left open/exposed) -->
  <text x="356" y="392" font-size="8" fill="#8a8378" transform="rotate(-90 356 392)">lower front: no apron</text>

  <!-- vertical dimension lines -->
  <g stroke="#4c463f" stroke-width="1">
    <line x1="410" y1="188" x2="410" y2="450"/>
    <line x1="404" y1="188" x2="416" y2="188"/><line x1="404" y1="450" x2="416" y2="450"/>
    <line x1="388" y1="314" x2="388" y2="450"/>
    <line x1="382" y1="314" x2="394" y2="314"/><line x1="382" y1="450" x2="394" y2="450"/>
  </g>
  <text x="410" y="315" font-size="11" font-weight="600" fill="#22201d" transform="rotate(-90 410 315)">upper seat ~40″</text>
  <text x="388" y="392" font-size="10" font-weight="600" fill="#22201d" transform="rotate(-90 388 392)">lower ~18″</text>

  <!-- depth dims (top) -->
  <g stroke="#4c463f" stroke-width="1">
    <line x1="100" y1="168" x2="244" y2="168"/><line x1="100" y1="162" x2="100" y2="174"/><line x1="244" y1="162" x2="244" y2="174"/>
    <line x1="244" y1="178" x2="352" y2="178"/><line x1="244" y1="172" x2="244" y2="184"/><line x1="352" y1="172" x2="352" y2="184"/>
  </g>
  <text x="172" y="165" text-anchor="middle" font-size="10" font-weight="600" fill="#22201d">upper depth 24″</text>
  <text x="298" y="192" text-anchor="middle" font-size="9" font-weight="600" fill="#22201d">lower 18″</text>

  <!-- callout labels -->
  <text x="150" y="120" font-size="10" fill="#5e3d1c">Cedar SEAT slats — ~⅜″ gaps</text>
  <line x1="150" y1="124" x2="150" y2="186" stroke="#5e3d1c" stroke-width="0.7"/>
  <text x="470" y="250" font-size="10" fill="#7a4e22">Cedar apron — UPPER only →</text>
  <line x1="252" y1="255" x2="466" y2="250" stroke="#7a4e22" stroke-width="0.7"/>
  <text x="470" y="410" font-size="10" fill="#8a8378">Hidden 2×4 frame (ledger,</text>
  <text x="470" y="424" font-size="10" fill="#8a8378">cross-joists, legs, front rail)</text>
  <text x="470" y="150" font-size="9" fill="#4c463f">Top bench 39–47″ below ceiling</text>

  <!-- =================== PLAN (top view) =================== -->
  <text x="90" y="512" font-size="14" font-weight="700" fill="#c1440e">PLAN (top view)</text>
  <!-- upper L -->
  <rect x="100" y="530" width="60" height="210" fill="#c89b6a" stroke="#8a5a2b"/>
  <rect x="160" y="530" width="185" height="60" fill="#c89b6a" stroke="#8a5a2b"/>
  <!-- lower L -->
  <rect x="160" y="590" width="45" height="150" fill="#b5824f" stroke="#7a4e22"/>
  <rect x="205" y="590" width="140" height="45" fill="#b5824f" stroke="#7a4e22"/>
  <text x="130" y="640" font-size="10" fill="#5e3d1c" transform="rotate(-90 130 640)">upper 24″D</text>
  <text x="250" y="565" text-anchor="middle" font-size="10" fill="#5e3d1c">upper back leg ~74″</text>
  <text x="182" y="700" font-size="9" fill="#fff" transform="rotate(-90 182 700)">lower 18″</text>
  <text x="275" y="617" text-anchor="middle" font-size="9" fill="#fff">lower step</text>
  <text x="90" y="762" font-size="9" fill="#4c463f">Side-wall legs ~80″ · benches bolt to wall ledgers; frame first, then clad.</text>

  <!-- =================== DETAIL (slat) =================== -->
  <text x="470" y="512" font-size="14" font-weight="700" fill="#c1440e">DETAIL — seat slats</text>
  <rect x="470" y="540" width="70" height="30" fill="#c89b6a" stroke="#8a5a2b"/>
  <rect x="558" y="540" width="70" height="30" fill="#c89b6a" stroke="#8a5a2b"/>
  <text x="505" y="558" text-anchor="middle" font-size="10" fill="#5e3d1c">3½″</text>
  <text x="593" y="558" text-anchor="middle" font-size="10" fill="#5e3d1c">3½″</text>
  <text x="549" y="590" text-anchor="middle" font-size="10" fill="#22201d">~⅜″ gap</text>
  <line x1="540" y1="574" x2="558" y2="574" stroke="#4c463f"/>
  <!-- screw from below -->
  <line x1="505" y1="595" x2="505" y2="570" stroke="#3a3a3a" stroke-width="2" marker-end="url(#up)"/>
  <text x="512" y="600" font-size="9" fill="#3a3a3a">SS screw from below (no top penetration)</text>
  <defs><marker id="up" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto"><path d="M0 8 L4 0 L8 8 z" fill="#3a3a3a"/></marker></defs>
  <text x="470" y="640" font-size="10" fill="#4c463f">Slats: clear VG Western Red Cedar 2×4, eased edges.</text>
  <text x="470" y="656" font-size="10" fill="#4c463f">Gaps drain water + let air pass (reduces layering).</text>
  <text x="470" y="672" font-size="10" fill="#4c463f">Same detail on the front-apron slats.</text>
</svg>
